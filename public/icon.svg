  />

  <!-- Ball seated in the pouch -->
  <circle cx="256" cy="140" r="58" fill="#f5f0e6"/>
  <circle cx="236" cy="122" r="16" fill="rgba(255,255,255,0.55)"/>
  <circle cx="256" cy="140" r="58" stroke="rgba(30,58,95,0.2)" stroke-width="4"/>
