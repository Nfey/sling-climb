  <rect width="512" height="512" fill="#1e3a5f"/>
  <!-- Soft vignette -->
  <circle cx="256" cy="256" r="220" fill="#244a73" opacity="0.45"/>

  <!-- Slingshot post + Y fork (safe zone for maskable) -->
